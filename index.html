<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cycle Protocol Tracker (Sun/Tue/Thu)</title>
<!-- Direct CDN Links -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
.no-scrollbar::-webkit-scrollbar { display: none; }
</style>
</head>
<body class="bg-gray-50 text-slate-900">
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // DATA: Sunday, Tuesday, Thursday Schedule starting March 1st
    const DATA = [
        { date: "1-Mar", wk: 1, day: "Sun", test: "250mg (1mL)", primo: "100mg (0mL)", anavar: "0mg", ai: "-", total: "1mL" },
        { date: "3-Mar", wk: 1, day: "Tue", test: "250mg (1mL)", primo: "100mg (1mL)", anavar: "0mg", ai: "0.25mg", total: "2mL" },
        { date: "5-Mar", wk: 1, day: "Thu", test: "250mg (1mL)", primo: "100mg (1mL)", anavar: "0mg", ai: "0.25mg", total: "2mL" },
        { date: "8-Mar", wk: 2, day: "Sun", test: "250mg (1mL)", primo: "100mg (1mL)", anavar: "0mg", ai: "0.25mg", total: "2mL" },
        { date: "10-Mar", wk: 2, day: "Tue", test: "250mg (1mL)", primo: "100mg (1mL)", anavar: "0mg", ai: "0.25mg", total: "2mL" },
        { date: "12-Mar", wk: 2, day: "Thu", test: "250mg (1mL)", primo: "100mg (1mL)", anavar: "0mg", ai: "0.25mg", total: "2mL" },
        { date: "15-Mar", wk: 3, day: "Sun", test: "250mg (1mL)", primo: "100mg (1mL)", anavar: "0mg", ai: "0.25mg", total: "2mL" },
        { date: "17-Mar", wk: 3, day: "Tue", test: "250mg (1mL)", primo: "100mg (1mL)", anavar: "0mg", ai: "0.25mg", total: "2mL" },
        { date: "19-Mar", wk: 3, day: "Thu", test: "250mg (1mL)", primo: "100mg (1mL)", anavar: "0mg", ai: "0.25mg", total: "2mL" },
        { date: "22-Mar", wk: 4, day: "Sun", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "0mg", ai: "0.25mg", total: "3mL" },
        { date: "24-Mar", wk: 4, day: "Tue", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "0mg", ai: "0.25mg", total: "3mL" },
        { date: "26-Mar", wk: 4, day: "Thu", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "0mg", ai: "0.25mg", total: "3mL" },
        { date: "29-Mar", wk: 5, day: "Sun", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "0mg", ai: "0.25mg", total: "3mL" },
        { date: "31-Mar", wk: 5, day: "Tue", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "0mg", ai: "0.25mg", total: "3mL" },
        { date: "2-Apr", wk: 5, day: "Thu", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "0mg", ai: "0.25mg", total: "3mL" },
        { date: "5-Apr", wk: 6, day: "Sun", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "0mg", ai: "0.25mg", total: "3mL" },
        { date: "7-Apr", wk: 6, day: "Tue", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "0mg", ai: "0.25mg", total: "3mL" },
        { date: "9-Apr", wk: 6, day: "Thu", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "0mg", ai: "0.25mg", total: "3mL" },
        { date: "12-Apr", wk: 7, day: "Sun", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "0mg", ai: "0.25mg", total: "3mL" },
        { date: "14-Apr", wk: 7, day: "Tue", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "0mg", ai: "0.25mg", total: "3mL" },
        { date: "16-Apr", wk: 7, day: "Thu", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "0mg", ai: "0.25mg", total: "3mL" },
        { date: "19-Apr", wk: 8, day: "Sun", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "25mg", ai: "0.25mg", total: "3mL" },
        { date: "21-Apr", wk: 8, day: "Tue", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "25mg", ai: "0.25mg", total: "3mL" },
        { date: "23-Apr", wk: 8, day: "Thu", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "25mg", ai: "0.25mg", total: "3mL" },
        { date: "26-Apr", wk: 9, day: "Sun", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "25mg", ai: "0.25mg", total: "3mL" },
        { date: "28-Apr", wk: 9, day: "Tue", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "25mg", ai: "0.25mg", total: "3mL" },
        { date: "30-Apr", wk: 9, day: "Thu", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "25mg", ai: "0.25mg", total: "3mL" },
        { date: "3-May", wk: 10, day: "Sun", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "25mg", ai: "0.25mg", total: "3mL" },
        { date: "5-May", wk: 10, day: "Tue", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "25mg", ai: "0.25mg", total: "3mL" },
        { date: "7-May", wk: 10, day: "Thu", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "25mg", ai: "0.25mg", total: "3mL" },
        { date: "10-May", wk: 11, day: "Sun", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "25mg", ai: "0.25mg", total: "3mL" },
        { date: "12-May", wk: 11, day: "Tue", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "25mg", ai: "0.25mg", total: "3mL" },
        { date: "14-May", wk: 11, day: "Thu", test: "500mg (2mL)", primo: "100mg (1mL)", anavar: "25mg", ai: "0.25mg", total: "3mL" },
        { date: "17-May", wk: 12, day: "Sun", test: "333mg (2mL)", primo: "100mg (1mL)", anavar: "25mg", ai: "0.25mg", total: "3mL" },
        { date: "19-May", wk: 12, day: "Tue", test: "333mg (2mL)", primo: "100mg (1mL)", anavar: "25mg", ai: "0.25mg", total: "3mL" },
        { date: "21-May", wk: 12, day: "Thu", test: "333mg (2mL)", primo: "100mg (1mL)", anavar: "25mg", ai: "0.25mg", total: "3mL" },
        { date: "24-May", wk: 13, day: "Sun", test: "250mg (1mL)", primo: "100mg (1mL)", anavar: "25mg", ai: "0.25mg", total: "2mL" },
        { date: "26-May", wk: 13, day: "Tue", test: "250mg (1mL)", primo: "100mg (1mL)", anavar: "25mg", ai: "0.25mg", total: "2mL" },
        { date: "28-May", wk: 13, day: "Thu", test: "250mg (1mL)", primo: "100mg (1mL)", anavar: "25mg", ai: "0.25mg", total: "2mL" },
        { date: "31-May", wk: 14, day: "Sun", test: "250mg (1mL)", primo: "100mg (1mL)", anavar: "25mg", ai: "0.25mg", total: "2mL" },
        { date: "2-Jun", wk: 14, day: "Tue", test: "250mg (1mL)", primo: "100mg (1mL)", anavar: "25mg", ai: "0.25mg", total: "2mL" },
        { date: "4-Jun", wk: 14, day: "Thu", test: "250mg (1mL)", primo: "100mg (1mL)", anavar: "25mg", ai: "0.25mg", total: "2mL" },
        { date: "7-Jun", wk: 15, day: "Sun", test: "250mg (1mL)", primo: "0mg (1mL)", anavar: "25mg", ai: "0.25mg", total: "2mL" },
        { date: "9-Jun", wk: 15, day: "Tue", test: "250mg (1mL)", primo: "0mg (0mL)", anavar: "25mg", ai: "0.25mg", total: "1mL" },
        { date: "11-Jun", wk: 15, day: "Thu", test: "250mg (1mL)", primo: "0mg (0mL)", anavar: "25mg", ai: "-", total: "1mL" }
    ];

    const App = () => {
        const [completed, setCompleted] = useState(() => JSON.parse(localStorage.getItem('cy_done') || '{}'));
        const [notes, setNotes] = useState(() => JSON.parse(localStorage.getItem('cy_notes') || '{}'));
        const [weights, setWeights] = useState(() => JSON.parse(localStorage.getItem('cy_weights') || '{}'));
        const [week, setWeek] = useState(1);
        const [view, setView] = useState('tracker');

        useEffect(() => { localStorage.setItem('cy_done', JSON.stringify(completed)); }, [completed]);
        useEffect(() => { localStorage.setItem('cy_notes', JSON.stringify(notes)); }, [notes]);
        useEffect(() => { localStorage.setItem('cy_weights', JSON.stringify(weights)); }, [weights]);

        const currentItems = useMemo(() => DATA.filter(d => d.wk === week), [week]);
        const totalDoneCount = Object.values(completed).filter(Boolean).length;
        const progress = Math.round((totalDoneCount / DATA.length) * 100);

        const journalEntries = useMemo(() => {
            return DATA.filter(item => {
                const id = `${item.date}-${item.wk}`;
                return (notes[id] && notes[id].trim() !== "") || (weights[id] && weights[id].trim() !== "");
            });
        }, [notes, weights]);

        return (
            <div className="max-w-md mx-auto min-h-screen flex flex-col pb-24">
                <header className="bg-white p-5 border-b sticky top-0 z-50 shadow-sm">
                    <div className="flex justify-between items-center mb-4">
                        <h1 className="text-xl font-black text-slate-900">
                            <span className="text-blue-600">Protocol</span> Tracker
                        </h1>
                        <div className="flex gap-2">
                            <span className="bg-blue-100 text-blue-700 text-[10px] font-black px-3 py-1 rounded-full uppercase">
                                {progress}% Total
                            </span>
                        </div>
                    </div>
                    <div className="w-full bg-gray-100 h-1.5 rounded-full overflow-hidden">
                        <div className="bg-blue-600 h-full transition-all duration-700 ease-out" style={{width: `${progress}%`}}></div>
                    </div>
                </header>

                {view === 'tracker' ? (
                    <div className="p-4 flex-grow animate-in fade-in duration-300">
                        <div className="flex items-center justify-between mb-6 bg-white p-4 rounded-[2rem] border shadow-sm">
                            <button onClick={() => setWeek(w => Math.max(1, w-1))} className="w-12 h-12 flex items-center justify-center bg-gray-50 rounded-2xl font-bold disabled:opacity-20 active:scale-90" disabled={week===1}>←</button>
                            <div className="text-center">
                                <p className="text-[10px] uppercase font-bold text-gray-400 tracking-widest">Protocol Stage</p>
                                <p className="text-xl font-black uppercase tracking-tight">Week {week}</p>
                            </div>
                            <button onClick={() => setWeek(w => Math.min(15, w+1))} className="w-12 h-12 flex items-center justify-center bg-gray-50 rounded-2xl font-bold disabled:opacity-20 active:scale-90" disabled={week===15}>→</button>
                        </div>

                        <div className="space-y-4">
                            {currentItems.map((item) => {
                                const id = `${item.date}-${item.wk}`;
                                const isDone = completed[id];
                                return (
                                    <div key={id} className={`p-6 rounded-[2.5rem] border transition-all duration-300 ${isDone ? 'bg-green-50/50 border-green-200' : 'bg-white border-gray-100 shadow-sm'}`}>
                                        <div className="flex justify-between items-start mb-5">
                                            <div>
                                                <h2 className="text-xl font-black text-slate-800 tracking-tight">{item.day}, {item.date}</h2>
                                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1">Injection Day</p>
                                            </div>
                                            <button 
                                                onClick={() => setCompleted(prev => ({...prev, [id]: !prev[id]}))}
                                                className={`w-14 h-14 rounded-3xl flex items-center justify-center text-xl transition-all active:scale-75 ${isDone ? 'bg-green-500 text-white shadow-lg shadow-green-200' : 'bg-gray-100 text-gray-300'}`}
                                            >
                                                {isDone ? '✓' : ''}
                                            </button>
                                        </div>

                                        <div className="grid grid-cols-2 gap-2 mb-5">
                                            <Badge label="Test" val={item.test} color="blue" />
                                            <Badge label="Primo" val={item.primo} color="purple" />
                                            <Badge label="Anavar" val={item.anavar} color="orange" />
                                            <Badge label="AI" val={item.ai} color="rose" />
                                        </div>

                                        <div className="space-y-4">
                                            <div>
                                                <label className="text-[10px] font-black text-slate-400 uppercase px-1">Body Weight (lbs)</label>
                                                <input 
                                                    type="number"
                                                    value={weights[id] || ''}
                                                    onChange={(e) => setWeights(prev => ({...prev, [id]: e.target.value}))}
                                                    placeholder="Enter weight..."
                                                    className="w-full mt-1 p-4 bg-gray-50 border border-gray-100 rounded-2xl text-sm outline-none focus:ring-4 focus:ring-blue-500/5 transition-all"
                                                />
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-black text-slate-400 uppercase px-1">Daily Log</label>
                                                <textarea 
                                                    value={notes[id] || ''}
                                                    onChange={(e) => setNotes(prev => ({...prev, [id]: e.target.value}))}
                                                    placeholder="Mood, site, or side effects..."
                                                    className="w-full mt-1 p-4 bg-gray-50 border border-gray-100 rounded-2xl text-sm outline-none focus:ring-4 focus:ring-blue-500/5 min-h-[100px] resize-none transition-all"
                                                />
                                            </div>
                                        </div>

                                        <div className="mt-4 pt-4 border-t border-dashed border-gray-200 flex justify-between items-center px-1">
                                            <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Total Volume</span>
                                            <span className="text-sm font-black text-slate-800">{item.total}</span>
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>
                ) : (
                    <div className="p-4 flex-grow animate-in slide-in-from-bottom-4 duration-300">
                        <h2 className="text-2xl font-black mb-6 px-2 text-slate-800">Cycle Summary</h2>
                        
                        <div className="grid grid-cols-2 gap-4 mb-8">
                            <div className="bg-blue-600 p-5 rounded-[2rem] text-white shadow-xl">
                                <p className="text-[10px] font-black opacity-60 uppercase tracking-widest mb-1">Injections</p>
                                <p className="text-3xl font-black">{totalDoneCount}</p>
                                <p className="text-[10px] font-bold opacity-60 mt-1">of {DATA.length}</p>
                            </div>
                            <div className="bg-white p-5 rounded-[2rem] border border-gray-100 shadow-sm">
                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Current</p>
                                <p className="text-3xl font-black text-slate-800">Wk {week}</p>
                            </div>
                        </div>

                        <div className="space-y-6">
                            <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest px-2">Cycle Log</h3>
                            {journalEntries.map(entry => {
                                const id = `${entry.date}-${entry.wk}`;
                                return (
                                    <div key={id} className="bg-white p-5 rounded-3xl border border-gray-100 shadow-sm">
                                        <div className="flex justify-between items-center mb-3">
                                            <div>
                                                <p className="text-sm font-black text-blue-600 leading-none">{entry.day}, {entry.date}</p>
                                                <p className="text-[10px] font-bold text-gray-400 uppercase mt-1">Week {entry.wk}</p>
                                            </div>
                                            {weights[id] && (
                                                <span className="bg-gray-100 text-slate-700 text-xs font-black px-2 py-1 rounded-lg">
                                                    {weights[id]} lbs
                                                </span>
                                            )}
                                        </div>
                                        {notes[id] && (
                                            <p className="text-slate-600 text-sm italic leading-relaxed">
                                                "{notes[id]}"
                                            </p>
                                        )}
                                    </div>
                                )
                            })}
                            {journalEntries.length === 0 && (
                                <p className="text-center text-gray-400 py-10 italic">No notes or weight recorded yet.</p>
                            )}
                        </div>
                    </div>
                )}

                <nav className="fixed bottom-0 left-0 right-0 p-4 z-50">
                    <div className="max-w-md mx-auto bg-slate-900 rounded-[2.5rem] p-2 flex gap-2 shadow-2xl">
                        <button onClick={() => setView('tracker')} className={`flex-1 py-4 rounded-[2rem] font-black text-xs uppercase tracking-widest transition-all ${view === 'tracker' ? 'bg-white text-slate-900 shadow-lg' : 'text-white/60 hover:text-white'}`}>Tracker</button>
                        <button onClick={() => setView('summary')} className={`flex-1 py-4 rounded-[2rem] font-black text-xs uppercase tracking-widest transition-all ${view === 'summary' ? 'bg-white text-slate-900 shadow-lg' : 'text-white/60 hover:text-white'}`}>Summary</button>
                    </div>
                </nav>
            </div>
        );
    };

    const Badge = ({ label, val, color }) => {
        const theme = {
            blue: 'bg-blue-50 text-blue-700 border-blue-100',
            purple: 'bg-purple-50 text-purple-700 border-purple-100',
            orange: 'bg-orange-50 text-orange-700 border-orange-100',
            rose: 'bg-rose-50 text-rose-700 border-rose-100',
        }[color];
        return (
            <div className={`p-2.5 rounded-2xl border ${theme}`}>
                <p className="text-[8px] font-black uppercase opacity-50 mb-1">{label}</p>
                <p className="text-xs font-black truncate">{val}</p>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>


</body>
</html>
